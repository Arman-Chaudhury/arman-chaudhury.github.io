<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Arman Chaudhury</title>
    <meta name="description" content="Arman Chaudhury. Software engineer in Queens, NY. Matching engines, data pipelines, agent tooling and interfaces. Selected work, experience and contact." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas class="gl" aria-hidden="true"></canvas>

    <!-- Accessible, crawlable mirror of the WebGL scene -->
    <div class="sr-only" id="sr"></div>

    <div class="loader" aria-hidden="true">
      <div class="loader-bars"><span class="loader-bar"></span><span class="loader-bar"></span><span class="loader-bar"></span></div>
      <span class="loader-count label">0</span>
    </div>

    <header class="chrome">
      <a class="label" href="./" data-hover>CHAUDHURY, ARMAN</a>
      <button class="label profile-toggle" type="button" aria-expanded="false" data-hover>
        <span class="swap"><span>PROFILE</span><span>CLOSE</span></span>
      </button>
    </header>

    <nav class="chrome chrome-bottom">
      <button class="label view-btn is-active" data-view="featured" type="button" data-hover><span class="dim">01</span> WORK</button>
      <button class="label view-btn" data-view="full" type="button" data-hover><span class="dim">02</span> INDEX</button>
      <button class="label view-btn" data-view="experience" type="button" data-hover><span class="dim">03</span> EXPERIENCE</button>
      <button class="label view-btn" data-view="contact" type="button" data-hover><span class="dim">04</span> CONTACT</button>
    </nav>

    <!-- Card titles: positioned every frame on top of the bent GL cards -->
    <div class="titles" aria-hidden="true"></div>

    <section class="profile" inert aria-label="Profile">
      <div class="profile-inner" data-gl-shield>
        <p class="profile-bio"></p>
        <p class="label profile-stats"></p>
        <ul class="profile-links"></ul>
      </div>
    </section>

    <section class="index overlay" inert aria-label="Full index">
      <div class="ov-inner"><ol class="index-list"></ol></div>
    </section>

    <section class="experience overlay" inert aria-label="Experience">
      <div class="ov-inner" data-gl-shield>
        <div class="ov-head row-anim"><span class="label dim">EXPERIENCE</span><a class="label ov-cv" data-hover target="_blank" rel="noopener">DOWNLOAD CV ↗</a></div>
        <ol class="xp-list"></ol>
        <div class="ov-head row-anim"><span class="label dim">EDUCATION</span></div>
        <ol class="xp-list xp-edu"></ol>
      </div>
    </section>

    <section class="contact overlay" inert aria-label="Contact">
      <div class="ov-inner ct-inner" data-gl-shield>
        <p class="label dim row-anim">CONTACT</p>
        <a class="ct-email row-anim" data-hover></a>
        <p class="ct-now row-anim"></p>
        <ul class="ct-links"></ul>
      </div>
    </section>

    <article class="panel" inert aria-label="Project">
      <div class="panel-scroll">
        <div class="panel-meta">
          <h2 class="panel-title"></h2>
          <p class="panel-desc"></p>
          <div class="panel-tags"></div>
          <div class="panel-links"></div>
          <div class="panel-writeup"></div>
        </div>
        <div class="panel-media"></div>
      </div>
      <button class="panel-close" type="button" aria-label="Close project">×</button>
    </article>

    <div class="cursor" aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
